# v8 acceptance candidate: v7 planning/control with depth-first localization.
# Keep g1_sim.yaml as the v7 A/B baseline until the localization bag passes.
version: v8
target_color: 4
rate_hz: 20.0
stale_s: 1.0

clips: data/sys1_clips.npz
frames:
  source: retargeted
  path: data/retargeted_motions
  library: data/sys1_library.npz

camera:
  host: 127.0.0.1
  port: 5555
mount:
  xyz: [0.05, 0.0, 0.4318]
  quat: [0.6533, 0.2706, -0.2706, -0.6533]

observe:
  read: plane
  proc_width: 0
  plane:
    floor_quantile: 0.70
    ransac_dist_m: 0.035
    top_band_m: 0.08
    close_px: 2
    fit_slack: 0.15
    range_max_m: 2.30

belief:
  window: 8
  min_votes: 3
  omega_still: 0.15

loop:
  pattern: RRF
  retry_limit: 3
  arm_radius: 0.30
  horizon_gain: 0.3
  stance_band_m: 0.70
  scan_sweep_deg: 90.0
  settle_steps: 40
  scan_steps: 110
  hold_tail: 15

seam:
  blend_frames: 12
  lead_in_rate: 1.5
  lead_in_min_s: 0.2
  enter_joint_rate: 2.0
