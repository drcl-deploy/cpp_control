# v8.5: v8 depth-first localization plus guarded approach locomotion.
# The clip retrieval/ranking and successful <=0.25 m correction band stay v8.
version: v8.5
target_color: 4
rate_hz: 20.0
stale_s: 1.0

clips: data/sys1_clips.npz
frames:
  source: retargeted
  path: data/retargeted_motions
  library: data/sys1_library.npz

camera:
  host: 127.0.0.1
  port: 5555
mount:
  xyz: [0.05, 0.0, 0.4318]
  quat: [0.6533, 0.2706, -0.2706, -0.6533]

observe:
  read: plane
  proc_width: 0
  plane:
    floor_quantile: 0.70
    ransac_dist_m: 0.035
    top_band_m: 0.08
    close_px: 2
    fit_slack: 0.15
    range_max_m: 2.30

belief:
  window: 8
  min_votes: 3
  omega_still: 0.15

loop:
  pattern: RRF
  retry_limit: 3
  arm_radius: 0.30
  horizon_gain: 0.3
  stance_band_m: 0.70
  scan_sweep_deg: 90.0
  settle_steps: 40
  scan_steps: 110
  hold_tail: 15

approach:
  enabled: true
  motion: data/sys1_walk/walk_forward_amateur_001__A001/motion.npz
  enter_m: 0.25
  target_m: 0.13
  max_step_m: 0.30
  turn_max_deg: 20.0
  turn_max_attempts: 3
  min_progress_m: 0.05
  max_attempts: 2
  window_step_m: 0.12
  window_snap: 4
  still_speed_m_s: 0.05
  speed_smooth: 9
  window_heading_max_deg: 45.0

seam:
  blend_frames: 12
  lead_in_rate: 1.5
  lead_in_min_s: 0.2
  enter_joint_rate: 2.0
