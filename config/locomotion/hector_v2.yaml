# Configuration for HectorV2 Locomotion Controller (18DOF)

control_dt: 0.02  # 50Hz control loop

workflow: "drcl_deploy"

# Topic names
lowcmd_topic: "/robot_command"
lowstate_topic: "/robot_state"

# Model path
onnx_path: "locomotion/hector_v2_sim2real.onnx"

# Control gains (18DOF, JOINT_NAMES_EXPR order)
# Leg joints (A1):    stiffness = 1e-4 * 9^2 * (10*2pi)^2  = 31.9775
#                     damping   = 2 * 2 * 1e-4 * 9^2 * (10*2pi) = 2.0358
# Knee joints (A1x2): stiffness = 1e-4 * 18^2 * (10*2pi)^2 = 127.9101
#                     damping   = 2 * 2 * 1e-4 * 18^2 * (10*2pi) = 8.1430
# Arm joints (RS01):  stiffness = 0.5e-4 * 7.75^2 * (10*2pi)^2 = 11.8559
#                     damping   = 2 * 2 * 0.5e-4 * 7.75^2 * (10*2pi) = 0.7548
# Elbow (RS01x1.5):   stiffness = 0.5e-4 * 11.625^2 * (10*2pi)^2 = 26.6757
#                     damping   = 2 * 2 * 0.5e-4 * 11.625^2 * (10*2pi) = 1.6982
kps: [31.9775, 31.9775, 31.9775, 127.9101, 31.9775,
      31.9775, 31.9775, 31.9775, 127.9101, 31.9775,
      11.8559, 11.8559, 11.8559,  26.6757,
      11.8559, 11.8559, 11.8559,  26.6757]
# kps: [31.9775, 31.9775, 31.9775, 31.9775, 31.9775,
#       31.9775, 31.9775, 31.9775, 31.9775, 31.9775,
#       11.8559, 11.8559, 11.8559,  11.8559,
#       11.8559, 11.8559, 11.8559,  11.8559]

# kps: [31.9775, 31.9775, 31.9775, 31.9775, 31.9775,
#       31.9775, 31.9775, 31.9775, 31.9775, 31.9775,
#       1.18559, 1.18559, 1.18559,  1.18559,
#       1.18559, 1.18559, 1.18559,  1.18559]

# kps: [3.19775, 3.19775, 3.19775, 3.19775, 3.19775,
#       3.19775, 3.19775, 3.19775, 3.19775, 3.19775,
#       1.18559, 1.18559, 1.18559,  2.66757,
#       1.18559, 1.18559, 1.18559,  2.66757]

kds: [2.0358, 2.0358, 2.0358, 8.1430, 2.0358,
      2.0358, 2.0358, 2.0358, 8.1430, 2.0358,
      0.7548, 0.7548, 0.7548, 1.6982,
      0.7548, 0.7548, 0.7548, 1.6982]
# kds: [2.0358, 2.0358, 2.0358, 2.0358, 2.0358,
#       2.0358, 2.0358, 2.0358, 2.0358, 2.0358,
#       0.7548, 0.7548, 0.7548, 0.7548,
#       0.7548, 0.7548, 0.7548, 0.7548]


# kds: [2.0358, 2.0358, 2.0358, 2.0358, 2.0358,
#       2.0358, 2.0358, 2.0358, 2.0358, 2.0358,
#       0.07548, 0.07548, 0.07548, 0.07548,
#       0.07548, 0.07548, 0.07548, 0.07548]

# kds: [0.20358, 0.20358, 0.20358, 0.81430, 0.20358,
#       0.20358, 0.20358, 0.20358, 0.81430, 0.20358,
#       0.07548, 0.07548, 0.07548, 0.16982,
#       0.07548, 0.07548, 0.07548, 0.16982]
      

# Default positions (JOINT_NAMES_EXPR order)
default_angles: [0.0,    0.0,    0.7848, -1.57,  0.7848,
                 0.0,    0.0,    0.7848, -1.57,  0.7848,
                 0.0,    0.6,    0.0,   -1.57,
                 0.0,    0.6,    0.0,   -1.57]

# Action scaling (matches Python base: 0.5 * action)
action_scale: [0.5, 0.5, 0.5, 0.5, 0.5,
               0.5, 0.5, 0.5, 0.5, 0.5,
               0.5, 0.5, 0.5, 0.5,
               0.5, 0.5, 0.5, 0.5]

# Model dimensions
num_actions: 18
num_obs: 63

# Joint names (JOINT_NAMES_EXPR order from constants.py)
joint_names: ["l_hip_yaw",   "l_hip_roll",   "l_hip_pitch",   "l_knee",   "l_ankle",
              "r_hip_yaw",   "r_hip_roll",   "r_hip_pitch",   "r_knee",   "r_ankle",
              "l_shoulder_yaw", "l_shoulder_pitch", "l_shoulder_roll", "l_elbow",
              "r_shoulder_yaw", "r_shoulder_pitch", "r_shoulder_roll", "r_elbow"]
